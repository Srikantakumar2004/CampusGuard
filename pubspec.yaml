publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^14.1.1
  connectivity_plus: ^6.1.5
  image_picker: ^1.2.4
  camera: ^0.10.6
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
