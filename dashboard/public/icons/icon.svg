<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="512" height="512" rx="128" fill="#080c16"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Shield Base -->
  <g filter="url(#glow)">
    <path d="M256 64 L384 128 C384 272 256 384 256 424 C256 384 128 272 128 128 Z" fill="url(#shieldGrad)" />
    <path d="M256 64 L384 128 C384 272 256 384 256 424 C256 384 128 272 128 128 Z" fill="url(#glowGrad)" />
  </g>

  <!-- Center Cross / Beacon -->
  <path d="M256 160 L256 320 M176 240 L336 240" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
  <circle cx="256" cy="240" r="28" fill="#ffffff"/>
  <circle cx="256" cy="240" r="14" fill="#ef4444"/>
</svg>
